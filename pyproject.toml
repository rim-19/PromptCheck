[project]
name = "promptcheck-drift"
version = "0.1.0"
description = "Regression monitoring for AI prompts — write test cases, run them against any model, catch drift before your users do."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Rim Elrhezzal" }]
keywords = ["llm", "prompt", "testing", "regression", "evaluation", "ci"]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/rim-19/PromptCheck"
Repository = "https://github.com/rim-19/PromptCheck"
Issues = "https://github.com/rim-19/PromptCheck/issues"

[project.scripts]
promptcheck = "promptcheck.cli:app"

[tool.pytest.ini_options]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["promptcheck"]
